name: Deploy Potential Website

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # ==========================================
      # 1. GET FILES FROM REPOSITORY
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v6


      # ==========================================
      # 2. SETUP GITHUB PAGES
      # ==========================================
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5


      # ==========================================
      # 3. PREPARE WEBSITE
      # ==========================================
      - name: Prepare website
        run: |

          # Create deployment folder
          mkdir -p _site


          # ======================================
          # LANDING PAGE
          # ======================================
          cp -R "landing page"/. _site/


          # ======================================
          # AUTHENTICATION PAGE
          # ======================================
          cp "auth.html" "_site/auth.html"


          # ======================================
          # ROOT SUPABASE FILES
          # ======================================
          cp "supabase-client.js" "_site/supabase-client.js"

          cp "supabase-config.js" "_site/supabase-config.js"


          # ======================================
          # STUDENT DASHBOARD
          # ======================================
          cp -R "student dashboard" "_site/student dashboard"


          # ======================================
          # BUSINESS DASHBOARD
          # ======================================
          cp -R "BUSINESS DASHBOARD" "_site/BUSINESS DASHBOARD"


          # ======================================
          # ADMIN
          # ======================================
          cp -R "Admin" "_site/Admin"


          # ======================================
          # SHOW DEPLOYMENT FILES
          # ======================================
          echo "=========================================="
          echo "FILES BEING DEPLOYED:"
          echo "=========================================="

          find _site -maxdepth 3 -type f | sort


      # ==========================================
      # 4. UPLOAD WEBSITE
      # ==========================================
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"


      # ==========================================
      # 5. DEPLOY WEBSITE
      # ==========================================
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
