name: Deploy Potential Website

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          mkdir -p _site

          cp -R "landing page"/. _site/

          cp "auth.html" "_site/auth.html"

          cp "supabase-client.js" "_site/supabase-client.js"
          cp "supabase-config.js" "_site/supabase-config.js"

          cp -R "student dashboard" "_site/student dashboard"

          cp -R "BUSINESS DASHBOARD" "_site/BUSINESS DASHBOARD"

          cp -R "Admin" "_site/Admin"

          echo "FILES BEING DEPLOYED:"
          find _site -maxdepth 3 -type f | sort

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
